<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Redirecting to PayHere - Craftora</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .redirect-card {
            background: white;
            width: 90%;
            max-width: 500px;

            padding: 40px;

            border-radius: 15px;

            text-align: center;

            box-shadow:
                    0 5px 20px
                    rgba(0, 0, 0, 0.08);
        }

        .logo {
            margin-bottom: 25px;
        }

        .craftora-logo {
            height: 62px;
            width: auto;
            object-fit: contain;
            border-radius: 12px;
        }

        h1 {
            color: #123B29;
            font-size: 24px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .loader {
            width: 45px;
            height: 45px;

            border: 4px solid #e5e5e5;

            border-top:
                    4px solid #123B29;

            border-radius: 50%;

            animation:
                    spin 1s linear infinite;

            margin: 25px auto;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .secure-text {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }

        .manual-button {
            margin-top: 20px;

            padding: 12px 25px;

            background: #123B29;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 14px;
        }

        .manual-button:hover {
            background: #1d5a40;
        }

    </style>

</head>


<body>

<div class="redirect-card">

    <!-- CRAFTORA LOGO -->

    <div class="logo">

        <img src="/images/craftora-logo.png"
             alt="Craftora Logo"
             class="craftora-logo">

    </div>


    <!-- TITLE -->

    <h1>
        Redirecting to PayHere
    </h1>


    <!-- MESSAGE -->

    <p>
        Please wait while we securely redirect you
        to PayHere Sandbox to complete your
        product payment.
    </p>


    <!-- LOADER -->

    <div class="loader"></div>


    <p class="secure-text">
        Please do not refresh or close this page.
    </p>


    <!-- PAYHERE FORM -->

    <form id="payhereForm"
          th:action="${checkoutUrl}"
          method="post">

        <!-- DYNAMIC PAYHERE DATA -->

        <div th:each="entry : ${checkoutData}">

            <input type="hidden"
                   th:name="${entry.key}"
                   th:value="${entry.value}">

        </div>


        <!-- MANUAL BUTTON -->

        <button type="submit"
                class="manual-button">

            Continue to PayHere

        </button>

    </form>

</div>


<!-- ==============================
     AUTOMATIC REDIRECT
============================== -->

<script>

    window.addEventListener(
        "load",
        function () {

            setTimeout(
                function () {

                    document
                        .getElementById("payhereForm")
                        .submit();

                },
                1500
            );

        }
    );

</script>

</body>

</html>
