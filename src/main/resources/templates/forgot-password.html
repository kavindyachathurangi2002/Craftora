<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Craftora</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F4E8D3;
            font-family: Arial, sans-serif;
        }

        .forgot-container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0 10px;
            color: #123B29;
            font-size: 28px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 15px 13px 42px;
            border: 1px solid #d8d1c5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #123B29;
        }

        .continue-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #123B29;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .continue-btn:hover {
            background: #C98A2E;
        }

        .error-message {
            background: #fde8e8;
            color: #b42318;
            border: 1px solid #f5c2c2;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #123B29;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #C98A2E;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .forgot-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="forgot-container">

    <img src="/images/craftora-logo.png"
         alt="Craftora Logo"
         class="logo">

    <h1>Forgot Password?</h1>

    <p class="description">
        Enter the email address registered with your Craftora account.
        We will send a verification OTP to your email.
    </p>

    <!-- Error Message -->
    <div class="error-message"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <!-- Email Form -->
    <form th:action="@{/forgot-password}"
          method="post"
          autocomplete="off">

        <div class="input-group">

            <label for="email">
                Registered Email
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-envelope"></i>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your registered email"
                       autocomplete="off"
                       required>

            </div>

        </div>

        <button type="submit"
                class="continue-btn">

            Continue

        </button>

    </form>

    <a href="/login"
       class="back-link">

        <i class="fa-solid fa-arrow-left"></i>
        Back to Login

    </a>

</div>

</body>
</html>
