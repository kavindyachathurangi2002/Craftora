<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Craftora</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F4E8D3;
            font-family: Arial, sans-serif;
        }

        .otp-container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 15px;
        }

        .otp-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #123B29;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        h1 {
            margin: 5px 0 10px;
            color: #123B29;
            font-size: 28px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .email-display {
            font-weight: bold;
            color: #123B29;
            word-break: break-word;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .otp-input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d8d1c5;
            border-radius: 8px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
        }

        .otp-input:focus {
            border-color: #123B29;
        }

        .continue-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #123B29;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .continue-btn:hover {
            background: #C98A2E;
        }

        .error-message {
            background: #fde8e8;
            color: #b42318;
            border: 1px solid #f5c2c2;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .back-link {
            display: inline-block;
            margin-top: 22px;
            color: #123B29;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #C98A2E;
            text-decoration: underline;
        }

        .otp-note {
            margin-top: 18px;
            color: #777;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .otp-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            .otp-input {
                font-size: 20px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>

<body>

<div class="otp-container">

    <img src="/images/craftora-logo.png"
         alt="Craftora Logo"
         class="logo">

    <div class="otp-icon">
        <i class="fa-solid fa-shield-halved"></i>
    </div>

    <h1>Verify OTP</h1>

    <p class="description">
        We have sent a 6-digit verification code to
        <br>
        <span class="email-display"
              th:text="${session.resetEmail}">
            your email
        </span>
    </p>

    <!-- Error Message -->
    <div class="error-message"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <!-- OTP Form -->
    <form th:action="@{/verify-otp}"
          method="post"
          autocomplete="off">

        <div class="input-group">

            <label for="otp">
                Enter OTP
            </label>

            <input type="text"
                   id="otp"
                   name="otp"
                   class="otp-input"
                   placeholder="000000"
                   maxlength="6"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   autocomplete="one-time-code"
                   required>

        </div>

        <button type="submit"
                class="continue-btn">

            Verify OTP

        </button>

    </form>

    <p class="otp-note">
        <i class="fa-regular fa-clock"></i>
        This OTP is valid for 5 minutes.
    </p>

    <a href="/forgot-password"
       class="back-link">

        <i class="fa-solid fa-arrow-left"></i>
        Back to Forgot Password

    </a>

</div>

</body>
</html>
