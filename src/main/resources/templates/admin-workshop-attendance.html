
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workshop Attendance | Craftora</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f8f6f1;
            color: #183c2d;
            padding: 35px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #174d37;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .heading {
            margin-bottom: 28px;
        }

        .heading h1 {
            color: #103d2b;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .heading p {
            color: #65736b;
            line-height: 1.6;
        }

        .card {
            background: #fff;
            border: 1px solid #e7dfd2;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(16, 61, 43, 0.05);
        }

        .card h2 {
            font-size: 19px;
            margin-bottom: 18px;
            color: #103d2b;
        }

        .workshop-select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8dfd8;
            border-radius: 9px;
            background: white;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            background: #174d37;
            color: white;
            border: none;
            border-radius: 9px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .button:hover {
            background: #103d2b;
        }

        .empty-state {
            padding: 25px;
            text-align: center;
            background: #f8f6f1;
            border-radius: 10px;
            color: #65736b;
            line-height: 1.7;
        }

        .empty-state i {
            display: block;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .note {
            color: #65736b;
            font-size: 13px;
            margin-top: 12px;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }

            .card {
                padding: 20px;
            }

            .heading h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/admin/events" class="back-link">
        <i class="bi bi-arrow-left"></i>
        Back to Events
    </a>

    <div class="heading">
        <h1>
            <i class="bi bi-clipboard-check"></i>
            Workshop Attendance
        </h1>

        <p>
            Select a published workshop to manage participant attendance
            and prepare certificates for eligible participants.
        </p>
    </div>

    <div class="card">
        <h2>
            <i class="bi bi-calendar-event"></i>
            Select Workshop
        </h2>

        <div th:if="${workshops == null or #lists.isEmpty(workshops)}"
             class="empty-state">

            <i class="bi bi-calendar-x"></i>

            <strong>No published workshops found.</strong>

            <p>
                Publish a workshop before managing attendance.
            </p>
        </div>

        <form th:if="${workshops != null and !#lists.isEmpty(workshops)}"
              action="/admin/workshop-attendance/participants"
              method="get">

            <label for="eventId">
                Choose a workshop
            </label>

            <select id="eventId"
                    name="eventId"
                    class="workshop-select"
                    required>

                <option value="">-- Select Workshop --</option>

                <option th:each="workshop : ${workshops}"
                        th:value="${workshop.eventId}"
                        th:text="${workshop.eventTitle}">
                </option>

            </select>

            <button type="submit" class="button">
                <i class="bi bi-people-fill"></i>
                View Participants
            </button>

            <p class="note">
                Only published workshops are listed here.
            </p>
        </form>
    </div>

</div>

</body>
</html>
