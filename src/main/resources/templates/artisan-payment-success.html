<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful - Craftora</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .success-box {
            background: white;
            width: 450px;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .success-icon {
            font-size: 60px;
            color: green;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .message {
            color: #198754;
            font-weight: bold;
        }

        .redirect-message {
            margin-top: 25px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="success-icon">
        ✓
    </div>

    <h1>Payment Successful!</h1>

    <p class="message">
        Your Artisan Registration payment has been completed successfully.
    </p>

    <p>
        A payment receipt has been generated and sent to your registered
        email address.
    </p>

    <p>
        Thank you for registering with Craftora.
    </p>

    <p class="redirect-message">
        You will be redirected to your Artisan Dashboard in
        <strong><span id="countdown">3</span></strong> seconds...
    </p>

</div>

<script>
    let seconds = 3;

    const countdown =
        document.getElementById("countdown");

    const timer =
        setInterval(function () {

            seconds--;

            countdown.textContent = seconds;

            if (seconds <= 0) {

                clearInterval(timer);

                window.location.href =
                    "/artisan-dashboard";
            }

        }, 1000);
</script>

</body>
</html>
