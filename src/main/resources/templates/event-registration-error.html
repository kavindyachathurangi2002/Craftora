<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Already Registered - Craftora</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7f6;
            font-family: Arial, sans-serif;
        }

        .message-box {
            width: 500px;
            max-width: 90%;
            background: #ffffff;
            padding: 45px;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .success-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #0b6b45;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            color: #0b6b45;
            margin: 0 0 20px;
            font-size: 32px;
        }

        p {
            color: #666;
            line-height: 1.6;
            font-size: 16px;
            margin: 8px 0;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #0b6b45;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #084f34;
        }

    </style>

</head>

<body>

<div class="message-box">

    <div class="success-icon">
        ✓
    </div>

    <h1>
        Already Registered
    </h1>

    <p>
        You are already registered for this event.
    </p>

    <p>
        You cannot register for the same event again.
    </p>

    <a th:href="@{/events/{id}(id=${event.eventId})}"
       class="btn">
        ← Back to Event
    </a>

</div>

</body>

</html>
