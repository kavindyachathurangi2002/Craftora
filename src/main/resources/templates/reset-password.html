<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Craftora</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #F4E8D3;
            font-family: Arial, sans-serif;
        }

        .reset-container {
            width: 90%;
            max-width: 450px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        .logo {
            width: 90px;
            margin-bottom: 15px;
        }

        .reset-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #123B29;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
        }

        h1 {
            margin: 5px 0 10px;
            color: #123B29;
            font-size: 28px;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 42px 13px 42px;
            border: 1px solid #d8d1c5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #123B29;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            left: auto !important;
            cursor: pointer;
            color: #777;
        }

        /* ==============================
           Password Requirements
           ============================== */

        .password-requirements {
            text-align: left;
            background: #f8f5ef;
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: -8px;
            margin-bottom: 20px;
            font-size: 12px;
        }

        .password-requirements p {
            margin: 0 0 7px;
            color: #555;
            font-weight: bold;
        }

        .password-requirements div {
            margin: 5px 0;
            color: #b42318;
        }

        .password-requirements div.valid {
            color: #198754;
        }

        .password-requirements i {
            margin-right: 6px;
        }

        .reset-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #123B29;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .reset-btn:hover {
            background: #C98A2E;
        }

        .error-message {
            background: #fde8e8;
            color: #b42318;
            border: 1px solid #f5c2c2;
            padding: 11px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .password-note {
            margin-top: 18px;
            color: #777;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .reset-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="reset-container">

    <img src="/images/craftora-logo.png"
         alt="Craftora Logo"
         class="logo">

    <div class="reset-icon">
        <i class="fa-solid fa-lock"></i>
    </div>

    <h1>Reset Password</h1>

    <p class="description">
        Create a new password for your Craftora account.
    </p>

    <!-- Error Message -->
    <div class="error-message"
         th:if="${errorMessage}"
         th:text="${errorMessage}">
    </div>

    <!-- Reset Password Form -->
    <form th:action="@{/reset-password}"
          method="post"
          autocomplete="off"
          id="resetPasswordForm">

        <!-- New Password -->
        <div class="input-group">

            <label for="password">
                New Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter new password"
                       autocomplete="new-password"
                       required>

                <i class="fa-solid fa-eye toggle-password"
                   id="togglePassword"></i>

            </div>

        </div>

        <!-- Password Requirements -->
        <div class="password-requirements">

            <p>Password must contain:</p>

            <div id="lengthRequirement">
                <i class="fa-solid fa-circle-xmark"></i>
                At least 8 characters
            </div>

            <div id="uppercaseRequirement">
                <i class="fa-solid fa-circle-xmark"></i>
                At least 1 uppercase letter (A-Z)
            </div>

            <div id="lowercaseRequirement">
                <i class="fa-solid fa-circle-xmark"></i>
                At least 1 lowercase letter (a-z)
            </div>

            <div id="numberRequirement">
                <i class="fa-solid fa-circle-xmark"></i>
                At least 1 number (0-9)
            </div>

            <div id="specialRequirement">
                <i class="fa-solid fa-circle-xmark"></i>
                At least 1 special character (@ # $ % !)
            </div>

        </div>

        <!-- Confirm Password -->
        <div class="input-group">

            <label for="confirmPassword">
                Confirm New Password
            </label>

            <div class="input-wrapper">

                <i class="fa-solid fa-lock"></i>

                <input type="password"
                       id="confirmPassword"
                       name="confirmPassword"
                       placeholder="Confirm new password"
                       autocomplete="new-password"
                       required>

                <i class="fa-solid fa-eye toggle-password"
                   id="toggleConfirmPassword"></i>

            </div>

        </div>

        <button type="submit"
                class="reset-btn">

            Update Password

        </button>

    </form>

    <p class="password-note">
        <i class="fa-solid fa-circle-info"></i>
        Your password must be strong and secure.
    </p>

</div>


<script>

    // ==============================
    // Password Elements
    // ==============================

    const password =
        document.getElementById("password");

    const confirmPassword =
        document.getElementById("confirmPassword");


    // ==============================
    // Password Requirements
    // ==============================

    const lengthRequirement =
        document.getElementById("lengthRequirement");

    const uppercaseRequirement =
        document.getElementById("uppercaseRequirement");

    const lowercaseRequirement =
        document.getElementById("lowercaseRequirement");

    const numberRequirement =
        document.getElementById("numberRequirement");

    const specialRequirement =
        document.getElementById("specialRequirement");


    // ==============================
    // Update Password Requirements
    // ==============================

    password.addEventListener("input", function () {

        const value = password.value;


        // Minimum 8 characters
        if (value.length >= 8) {

            lengthRequirement.classList.add("valid");

            lengthRequirement.innerHTML =
                '<i class="fa-solid fa-circle-check"></i>' +
                ' At least 8 characters';

        } else {

            lengthRequirement.classList.remove("valid");

            lengthRequirement.innerHTML =
                '<i class="fa-solid fa-circle-xmark"></i>' +
                ' At least 8 characters';
        }


        // Uppercase
        if (/[A-Z]/.test(value)) {

            uppercaseRequirement.classList.add("valid");

            uppercaseRequirement.innerHTML =
                '<i class="fa-solid fa-circle-check"></i>' +
                ' At least 1 uppercase letter (A-Z)';

        } else {

            uppercaseRequirement.classList.remove("valid");

            uppercaseRequirement.innerHTML =
                '<i class="fa-solid fa-circle-xmark"></i>' +
                ' At least 1 uppercase letter (A-Z)';
        }


        // Lowercase
        if (/[a-z]/.test(value)) {

            lowercaseRequirement.classList.add("valid");

            lowercaseRequirement.innerHTML =
                '<i class="fa-solid fa-circle-check"></i>' +
                ' At least 1 lowercase letter (a-z)';

        } else {

            lowercaseRequirement.classList.remove("valid");

            lowercaseRequirement.innerHTML =
                '<i class="fa-solid fa-circle-xmark"></i>' +
                ' At least 1 lowercase letter (a-z)';
        }


        // Number
        if (/[0-9]/.test(value)) {

            numberRequirement.classList.add("valid");

            numberRequirement.innerHTML =
                '<i class="fa-solid fa-circle-check"></i>' +
                ' At least 1 number (0-9)';

        } else {

            numberRequirement.classList.remove("valid");

            numberRequirement.innerHTML =
                '<i class="fa-solid fa-circle-xmark"></i>' +
                ' At least 1 number (0-9)';
        }


        // Special character
        if (/[@#$%!]/.test(value)) {

            specialRequirement.classList.add("valid");

            specialRequirement.innerHTML =
                '<i class="fa-solid fa-circle-check"></i>' +
                ' At least 1 special character (@ # $ % !)';

        } else {

            specialRequirement.classList.remove("valid");

            specialRequirement.innerHTML =
                '<i class="fa-solid fa-circle-xmark"></i>' +
                ' At least 1 special character (@ # $ % !)';
        }

    });


    // ==============================
    // Show / Hide New Password
    // ==============================

    document.getElementById("togglePassword")
        .addEventListener("click", function () {

            if (password.type === "password") {

                password.type = "text";

                this.classList.remove("fa-eye");
                this.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                this.classList.remove("fa-eye-slash");
                this.classList.add("fa-eye");
            }

        });


    // ==============================
    // Show / Hide Confirm Password
    // ==============================

    document.getElementById("toggleConfirmPassword")
        .addEventListener("click", function () {

            if (confirmPassword.type === "password") {

                confirmPassword.type = "text";

                this.classList.remove("fa-eye");
                this.classList.add("fa-eye-slash");

            } else {

                confirmPassword.type = "password";

                this.classList.remove("fa-eye-slash");
                this.classList.add("fa-eye");
            }

        });


    // ==============================
    // Form Validation
    // ==============================

    document.getElementById("resetPasswordForm")
        .addEventListener("submit", function (event) {

            const value = password.value;

            const isStrongPassword =
                value.length >= 8 &&
                /[A-Z]/.test(value) &&
                /[a-z]/.test(value) &&
                /[0-9]/.test(value) &&
                /[@#$%!]/.test(value);


            // Check strong password
            if (!isStrongPassword) {

                event.preventDefault();

                alert(
                    "Password must be at least 8 characters and include an uppercase letter, lowercase letter, number, and special character."
                );

                return;
            }


            // Check password confirmation
            if (password.value !== confirmPassword.value) {

                event.preventDefault();

                alert(
                    "Passwords do not match. Please try again."
                );

                return;
            }

        });

</script>

</body>
</html>
