<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Product - Craftora</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f8f3;
            color: #333;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            height: 100vh;
            background: #143d2b;
            color: white;
            padding: 25px 18px;
        }

        .logo-section {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo-box {
            width: 210px;
            height: 66px;
            background: #ffffff;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7px 12px;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .menu-title {
            font-size: 12px;
            color: #b8c9bd;
            margin: 20px 12px 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 14px;
            margin-bottom: 6px;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: .2s;
        }

        .menu-link:hover,
        .menu-link.active {
            background: #d6a84f;
            color: #143d2b;
        }

        .menu-link i { font-size: 18px; }

        .switch-link {
            margin-top: 18px;
            border: 1px solid rgba(255,255,255,.2);
        }

        .main-content {
            margin-left: 250px;
            min-height: 100vh;
        }

        .topbar {
            height: 75px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid #e8e8e8;
        }

        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #143d2b;
            margin: 0;
        }

        .top-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .switch-account-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 13px;
            border: 1px solid #d6a84f;
            border-radius: 7px;
            color: #143d2b;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .switch-account-btn:hover {
            background: #d6a84f;
            color: white;
        }

        .artisan-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            background: #d6a84f;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #143d2b;
            font-weight: bold;
        }

        .artisan-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            padding: 35px;
        }

        .form-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border: 1px solid #e3e3e3;
            border-radius: 14px;
            padding: 35px;
        }

        .form-heading {
            color: #143d2b;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .form-subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-label {
            color: #143d2b;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-control,
        .form-select {
            border: 1px solid #d7ddd8;
            border-radius: 8px;
            padding: 11px 13px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #d6a84f;
            box-shadow: 0 0 0 .15rem rgba(214,168,79,.18);
        }

        textarea.form-control {
            min-height: 130px;
            resize: vertical;
        }

        .current-image {
            width: 180px;
            height: 180px;
            margin: 10px auto 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
            background: #f7f7f4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .current-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .image-upload-box {
            border: 2px dashed #d8ddd8;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            background: #fafbf8;
        }

        .image-upload-box i {
            font-size: 42px;
            color: #d6a84f;
        }

        .image-upload-box p {
            margin: 8px 0 15px;
            color: #777;
            font-size: 14px;
        }

        .image-preview {
            width: 170px;
            height: 170px;
            margin: 20px auto 0;
            border-radius: 10px;
            overflow: hidden;
            display: none;
            border: 1px solid #ddd;
            background: #f7f7f4;
        }

        .image-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #eee;
        }

        .cancel-btn {
            padding: 11px 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: white;
            color: #555;
            text-decoration: none;
            font-weight: 600;
        }

        .cancel-btn:hover {
            background: #f3f3f3;
            color: #333;
        }

        .save-btn {
            padding: 11px 25px;
            border-radius: 8px;
            border: none;
            background: #d6a84f;
            color: #143d2b;
            font-weight: 700;
        }

        .save-btn:hover {
            background: #bf9138;
            color: white;
        }

        @media (max-width: 700px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main-content { margin-left: 0; }

            .content { padding: 20px; }

            .form-container { padding: 22px; }

            .topbar { padding: 0 20px; }
        }
    </style>
</head>

<body>

<div class="sidebar">

    <div class="logo-section">
        <div class="logo-box">
            <img src="/images/craftora-logo.png" alt="Craftora Logo">
        </div>
    </div>

    <div class="menu-title">Main Menu</div>

    <a href="/artisan-dashboard" class="menu-link">
        <i class="bi bi-grid-1x2-fill"></i>
        <span>Dashboard</span>
    </a>

    <a href="/artisan/products" class="menu-link active">
        <i class="bi bi-box-seam"></i>
        <span>Products</span>
    </a>

    <a href="#" class="menu-link">
        <i class="bi bi-cart3"></i>
        <span>Orders</span>
    </a>

    <a href="#" class="menu-link">
        <i class="bi bi-calendar-event"></i>
        <span>Events</span>
    </a>

    <div class="menu-title">Account</div>

    <a href="/artisan/profile" class="menu-link">
        <i class="bi bi-person-circle"></i>
        <span>My Profile</span>
    </a>

    <div th:if="${session.userRoles != null and #lists.size(session.userRoles) > 1}">
        <a href="/switch-account" class="menu-link switch-link">
            <i class="bi bi-arrow-left-right"></i>
            <span>Switch Account</span>
        </a>
    </div>

    <a href="/logout" class="menu-link">
        <i class="bi bi-box-arrow-right"></i>
        <span>Logout</span>
    </a>

</div>

<div class="main-content">

    <div class="topbar">

        <h1 class="page-title">Edit Product</h1>

        <div class="top-right">

            <div th:if="${session.userRoles != null and #lists.size(session.userRoles) > 1}">
                <a href="/switch-account" class="switch-account-btn">
                    <i class="bi bi-arrow-left-right"></i>
                    <span>Switch Account</span>
                </a>
            </div>

            <div class="artisan-avatar"
                 th:if="${artisan != null and artisan.profileImage != null and artisan.profileImage != ''}">
                <img th:src="${artisan.profileImage.startsWith('/')
                                ? artisan.profileImage
                                : '/' + artisan.profileImage}"
                     alt="Artisan Profile">
            </div>

            <div class="artisan-avatar"
                 th:unless="${artisan != null and artisan.profileImage != null and artisan.profileImage != ''}">
                A
            </div>

        </div>

    </div>

    <div class="content">

        <div class="form-container">

            <h2 class="form-heading">Edit Product</h2>

            <p class="form-subtitle">
                Update your handmade product details.
            </p>

            <form action="/artisan/products/edit/save"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       name="productId"
                       th:value="${product.productId}">

                <div class="mb-4">

                    <label class="form-label">
                        Product Name
                    </label>

                    <input type="text"
                           name="productName"
                           class="form-control"
                           th:value="${product.productName}"
                           required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Craft / Category
                    </label>

                    <select id="category"
                            class="form-select"
                            required>

                        <option value="">
                            Select category
                        </option>

                        <option value="Pottery">Pottery</option>
                        <option value="Wood Carving">Wood Carving</option>
                        <option value="Wooden Crafts">Wooden Crafts</option>
                        <option value="Batik">Batik</option>
                        <option value="Handloom">Handloom</option>
                        <option value="Weaving">Weaving</option>
                        <option value="Basketry">Basketry</option>
                        <option value="Cane Crafts">Cane Crafts</option>
                        <option value="Bamboo Crafts">Bamboo Crafts</option>
                        <option value="Palmyrah Crafts">Palmyrah Crafts</option>
                        <option value="Coconut Shell Products">Coconut Shell Products</option>
                        <option value="Coconut Leaf Crafts">Coconut Leaf Crafts</option>
                        <option value="Paper Crafts">Paper Crafts</option>
                        <option value="Paper Quilling">Paper Quilling</option>
                        <option value="Crochet">Crochet</option>
                        <option value="Knitting">Knitting</option>
                        <option value="Embroidery">Embroidery</option>
                        <option value="Sewing">Sewing</option>
                        <option value="Textile Crafts">Textile Crafts</option>
                        <option value="Beadwork">Beadwork</option>
                        <option value="Jewellery">Jewellery</option>
                        <option value="Clay Crafts">Clay Crafts</option>
                        <option value="Terracotta">Terracotta</option>
                        <option value="Traditional Painting">Traditional Painting</option>
                        <option value="Canvas Painting">Canvas Painting</option>
                        <option value="Mask Making">Mask Making</option>
                        <option value="Traditional Masks">Traditional Masks</option>
                        <option value="Leather Crafts">Leather Crafts</option>
                        <option value="Stone Crafts">Stone Crafts</option>
                        <option value="Glass Crafts">Glass Crafts</option>
                        <option value="Metal Crafts">Metal Crafts</option>
                        <option value="Brass Crafts">Brass Crafts</option>
                        <option value="Silver Crafts">Silver Crafts</option>
                        <option value="Flower Crafts">Flower Crafts</option>
                        <option value="Recycled Crafts">Recycled Crafts</option>
                        <option value="Handmade Toys">Handmade Toys</option>
                        <option value="Other">Other</option>

                    </select>

                    <div id="customCategoryBox"
                         style="display:none; margin-top:12px;">

                        <input type="text"
                               id="customCategory"
                               class="form-control"
                               placeholder="Enter your product category...">

                    </div>

                    <input type="hidden"
                           id="finalCategory"
                           name="category"
                           th:value="${product.category}">

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Product Description
                    </label>

                    <textarea name="description"
                              class="form-control"
                              required
                              th:text="${product.description}"></textarea>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Price (LKR)
                        </label>

                        <input type="number"
                               name="price"
                               class="form-control"
                               min="0"
                               step="0.01"
                               th:value="${product.price}"
                               required>

                    </div>

                    <div class="col-md-6 mb-4">

                        <label class="form-label">
                            Stock Quantity
                        </label>

                        <input type="number"
                               name="stockQuantity"
                               class="form-control"
                               min="0"
                               th:value="${product.stockQuantity}"
                               required>

                    </div>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Current Product Image
                    </label>

                    <div class="current-image"
                         th:if="${product.productImage != null and product.productImage != ''}">

                        <img th:src="${product.productImage.startsWith('/')
                                      ? product.productImage
                                      : '/' + product.productImage}"
                             alt="Current Product Image">

                    </div>

                    <div class="image-upload-box">

                        <i class="bi bi-cloud-arrow-up"></i>

                        <p>
                            Select a new image only if you want to replace the current image.
                        </p>

                        <input type="file"
                               id="productImage"
                               name="productImage"
                               class="form-control"
                               accept="image/*"
                               onchange="previewProductImage(event)">

                        <div class="image-preview"
                             id="imagePreview">

                            <img id="previewImage"
                                 src=""
                                 alt="New Product Preview">

                        </div>

                    </div>

                </div>

                <div class="form-actions">

                    <a href="/artisan/products"
                       class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit"
                            class="save-btn">
                        <i class="bi bi-check-lg"></i>
                        Update Product
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script>
    const categorySelect = document.getElementById("category");
    const customCategoryBox = document.getElementById("customCategoryBox");
    const customCategory = document.getElementById("customCategory");
    const finalCategory = document.getElementById("finalCategory");

    const existingCategory = finalCategory.value;

    const standardCategories = [
        "Pottery", "Wood Carving", "Wooden Crafts", "Batik",
        "Handloom", "Weaving", "Basketry", "Cane Crafts",
        "Bamboo Crafts", "Palmyrah Crafts", "Coconut Shell Products",
        "Coconut Leaf Crafts", "Paper Crafts", "Paper Quilling",
        "Crochet", "Knitting", "Embroidery", "Sewing",
        "Textile Crafts", "Beadwork", "Jewellery", "Clay Crafts",
        "Terracotta", "Traditional Painting", "Canvas Painting",
        "Mask Making", "Traditional Masks", "Leather Crafts",
        "Stone Crafts", "Glass Crafts", "Metal Crafts",
        "Brass Crafts", "Silver Crafts", "Flower Crafts",
        "Recycled Crafts", "Handmade Toys"
    ];

    if (standardCategories.includes(existingCategory)) {
        categorySelect.value = existingCategory;
        finalCategory.value = existingCategory;
    } else if (existingCategory) {
        categorySelect.value = "Other";
        customCategoryBox.style.display = "block";
        customCategory.value = existingCategory;
        finalCategory.value = existingCategory;
    }

    categorySelect.addEventListener("change", function () {

        if (this.value === "Other") {
            customCategoryBox.style.display = "block";
            customCategory.required = true;
            customCategory.focus();

            finalCategory.value = customCategory.value.trim();
        } else {
            customCategoryBox.style.display = "none";
            customCategory.required = false;
            customCategory.value = "";
            finalCategory.value = this.value;
        }
    });

    customCategory.addEventListener("input", function () {
        finalCategory.value = this.value.trim();
    });

    function previewProductImage(event) {

        const file = event.target.files[0];
        const preview = document.getElementById("imagePreview");
        const image = document.getElementById("previewImage");

        if (file) {
            image.src = URL.createObjectURL(file);
            preview.style.display = "block";
        } else {
            image.src = "";
            preview.style.display = "none";
        }
    }
</script>

</body>
</html>
