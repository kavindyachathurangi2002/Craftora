
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In Required - Craftora</title>

    <link rel="stylesheet" href="/css/style.css">

    <style>
        .signin-required-section {
            min-height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .signin-required-card {
            max-width: 550px;
            width: 100%;
            text-align: center;
            background: white;
            padding: 45px 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .signin-required-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .signin-required-card h2 {
            color: #3d2b1f;
            margin-bottom: 15px;
        }

        .signin-required-card p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .signin-action-btn {
            display: inline-block;
            padding: 13px 30px;
            background: #8b5e3c;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin: 5px;
        }

        .signin-action-btn:hover {
            background: #6d452b;
        }

        .back-action-btn {
            background: #777;
        }

        .back-action-btn:hover {
            background: #555;
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        <a href="/">
            <img src="/images/craftora-logo.png" alt="Craftora Logo">
        </a>
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/about-us">About Us</a>
        <a href="/marketplace">Marketplace</a>
        <a href="/ratings">Ratings</a>
    </div>

    <div class="sign-in">
        <a href="/login">Sign In</a>
    </div>

</nav>


<section class="signin-required-section">

    <div class="signin-required-card">

        <div class="signin-required-icon">🔒</div>

        <h2>Sign In Required</h2>

        <p>
            Please sign in to your Craftora account to view
            the full artisan profile and contact information.
        </p>

        <a href="/login" class="signin-action-btn">
            Sign In
        </a>

        <a href="/all-artisans"
           class="signin-action-btn back-action-btn">
            Back to Artisans
        </a>

    </div>

</section>


<footer class="site-footer">
    <div class="footer-bottom">
        <p>© 2026 Craftora Project. All Rights Reserved.</p>
    </div>
</footer>

</body>
</html>
